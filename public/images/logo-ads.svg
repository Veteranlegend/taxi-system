<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <!-- Background -->
  <rect width="1200" height="1200" fill="#0f172a" rx="120"/>

  <!-- Green accent bar -->
  <rect x="0" y="820" width="1200" height="8" fill="#25D366" rx="0"/>

  <!-- Car icon (centered, top area) -->
  <g transform="translate(600, 430)">
    <!-- Car body -->
    <rect x="-220" y="20" width="440" height="160" fill="#25D366" rx="28"/>
    <!-- Car roof -->
    <path d="M-140,-80 L-180,20 L180,20 L140,-80 Q100,-130 0,-140 Q-100,-130 -140,-80 Z" fill="#25D366"/>
    <!-- Windshield -->
    <path d="M-110,-70 L-140,20 L140,20 L110,-70 Q80,-110 0,-118 Q-80,-110 -110,-70 Z" fill="#0f172a" opacity="0.5"/>
    <!-- Left window -->
    <path d="M-138,-55 L-158,20 L-30,20 L-20,-90 Q-80,-100 -138,-55 Z" fill="#1e3a5f" opacity="0.7"/>
    <!-- Right window -->
    <path d="M138,-55 L158,20 L30,20 L20,-90 Q80,-100 138,-55 Z" fill="#1e3a5f" opacity="0.7"/>
    <!-- Left wheel -->
    <circle cx="-145" cy="185" r="55" fill="#0f172a"/>
    <circle cx="-145" cy="185" r="35" fill="#334155"/>
    <circle cx="-145" cy="185" r="14" fill="#25D366"/>
    <!-- Right wheel -->
    <circle cx="145" cy="185" r="55" fill="#0f172a"/>
    <circle cx="145" cy="185" r="35" fill="#334155"/>
    <circle cx="145" cy="185" r="14" fill="#25D366"/>
    <!-- Headlight left -->
    <rect x="-215" y="60" width="50" height="28" fill="#fef08a" rx="8"/>
    <!-- Taillight right -->
    <rect x="165" y="60" width="50" height="28" fill="#f87171" rx="8"/>
    <!-- Door line -->
    <line x1="-10" y1="25" x2="-10" y2="175" stroke="#0f172a" stroke-width="5" opacity="0.4"/>
    <!-- Taxi sign on roof -->
    <rect x="-55" y="-175" width="110" height="42" fill="#fbbf24" rx="8"/>
    <text x="0" y="-145" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#0f172a">TAXI</text>
  </g>

  <!-- Company name -->
  <text x="600" y="910" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="98" font-weight="900" fill="#ffffff" letter-spacing="-2">DIRECT TAXI</text>
  <text x="600" y="1010" text-anchor="middle" font-family="Arial, sans-serif" font-size="62" font-weight="400" fill="#25D366" letter-spacing="18">LEBANON</text>
</svg>
